# Real-data density estimation (UCI). Fixed gradient-step
# budget shared by all models, converted to epochs per dataset (train sizes span 56x).
uci:
  datasets: ["POWER", "GAS", "HEPMASS", "MINIBOONE"]
  models: ["SSTM", "MAF", "NSF", "GNF"]   # MAF / RQ-NSF(AR) = nflows, baselines/flows.py;
                                                  # GNF = the authors' vendored code (GNF block below)
  seeds: [0, 1, 2, 3, 4]
  eval_batch: 8192           # chunked NLL evaluation (POWER test = 205k rows)
  n_train: null              # subsample the train split for fast-feedback ablations (e.g. 50000);
                             # then set flows.per_dataset.<DS>.steps for the epochs you want
                             # (50k rows / batch 512 = 97 steps per epoch) and run via --ablate/--study.
  # No separate budget knobs: every model trains at Table 5's per-dataset batch size and
  # step count (flows.per_dataset below), converted to epochs in run_one.
  log_every: 10
  n_checkpoints: 0

  SSTM:              # the paper default (synthetic block), new fit keys;
    hidden: [256, 256, 256] # uniform for all four datasets (capacity search: depth-3
                             # beats width per parameter; sacrifice vs per-dataset bests ~0.3 nats, on MINIBOONE)
    hidden_per_dataset:      # per-dataset size, like the flows' Table 5 (5-seed runs:
      MINIBOONE: [128, 128, 128]   # 256x3 overfits the 29.6k rows -> tie with flows; 128x3 wins
    disconnect_first_n: 1    # no known roots on real data
    lr_map: 0.01
    lr_ordering: 0.01
    lr_sparsity: 0.01
    l2: 0
    l1: null                 # EBIC — effectively zero at these n, the adaptive rule doing its job
    optimizer: adam
    gate_method: "ste"
    sparsity_strength: 1.0e-3
    perm_method: "softsort"
    fixed_order: null        # diagnostic: "identity" pins the column order (null = learned)
    dense_gates: true        # headline UCI row = gates open: every pruning setting
                             # costs likelihood on these dense-truth benchmarks; sparsity story lives in
                             # the synthetic experiments and Sachs
    lr_decay: cosine         # adopted for real data (ramp-and-hold peaks mid-training at full scale);
                             # to 0 over the second half (flows anneal the same way; see fit docstring)
    warmup: 1                # map-only epochs before ordering/sparsity ramps start. Synthetic default
                             # 50 epochs = 200-800 steps; here one epoch is 461-3242 steps, so 1 matches
                             # or exceeds it. All ramps (peak = epochs/2, tau lock) key to the budget.

  # Flow baselines at the NSF paper's setup, as close as possible: Table 5
  # (autoregressive) per-dataset steps/batch/lr/width/blocks/bins/dropout, in the
  # authors' own library (nflows). Their step counts are converted to epochs per dataset in run_one (drop_last, so
  # steps_per_epoch = n // batch). Deliberate epoch-based deviations from their uci.py,
  # both disclosed: val + best-val checkpointing per EPOCH (paper: every 250 steps) and
  # cosine annealing stepped per epoch over the same horizon. No other guards: a run
  # that diverges before its first finite-val checkpoint reports NaN, as theirs would.
  flows:
    transforms: 10
    tail_bound: 3.0
    maf_scale: sigmoid       # MAF affine scale: sigmoid (paper, bounded) | softplus (pip-nflows,
                             # unbounded: ~2/10 POWER seeds diverge) | zuko ([1e-3,1e3], identity init)
    weight_decay: 0.0
    per_dataset:             # NSF paper Table 5, autoregressive column per dataset
      POWER:     {steps: 400000, batch_size: 512, lr: 5.0e-4, hidden_features: 256, num_blocks: 2, bins: 8, dropout: 0.0}
      GAS:       {steps: 400000, batch_size: 512, lr: 5.0e-4, hidden_features: 256, num_blocks: 2, bins: 8, dropout: 0.1}
      HEPMASS:   {steps: 400000, batch_size: 512, lr: 5.0e-4, hidden_features: 256, num_blocks: 2, bins: 8, dropout: 0.2}
      MINIBOONE: {steps: 250000, batch_size: 64,  lr: 3.0e-4, hidden_features: 64,  num_blocks: 1, bins: 4, dropout: 0.2}

  # GNF (Wehenkel & Louppe 2021) at the authors' OWN per-dataset configuration, read off the
  # mono-DAG entries of the config file in their repo (UCIExperiments.py), which fills the gaps
  # their Table 6 leaves: batch size, embedding/integrand widths, dual-step cadence, solver and
  # weight decay. Note l1 = 0 on all four: their UCI runs learn no sparsity, so the conditioner
  # converges to a near-complete DAG and GNF behaves as a one-step dense flow, which is what
  # their UCI claim is about. Deviation, disclosed in the paper: epochs come from OUR shared
  # budget (flows.per_dataset above, converted in run_one), not their 10,000-epoch cap with
  # validation patience, which their released code does not implement. Batch size is theirs, so
  # GNF's update count differs from the flows' (steps_actual records each model's own).
  GNF:
    nb_steps: 20               # UMNN integration steps (+U{0,9} per batch, +20 at eval)
    gumble_T: 0.5              # their train() setting
    lr: 1.0e-3                 # their Table 6
    l1: 0.0
    per_dataset:
      POWER:     {batch_size: 2500,  emb_net: [60, 60, 60, 30],    int_net: [100, 100, 100], nb_steps_dual: 30,  solver: "CC",         weight_decay: 1.0e-5}
      GAS:       {batch_size: 10000, emb_net: [80, 80, 80, 30],    int_net: [200, 200, 200], nb_steps_dual: 100, solver: "CC",         weight_decay: 1.0e-3}
      HEPMASS:   {batch_size: 100,   emb_net: [210, 210, 210, 30], int_net: [200, 200, 200], nb_steps_dual: 25,  solver: "CCParallel", weight_decay: 1.0e-4}
      MINIBOONE: {batch_size: 100,   emb_net: [430, 430, 430, 30], int_net: [40, 40, 40],    nb_steps_dual: 200, solver: "CCParallel", weight_decay: 1.0e-2}


# Synthetic density + structure grid (generated DAGs, funnel, hierarchical).
synthetic:
  models:     [oracle, random, two_stage, learned, maf, nsf]   # structure source (SSTM) + flow baselines (density only)
  graph_type: ["ER", "SF", "funnel", "hierarch"]         # funnel = Neal's funnel; hier = 2-level hierarchical (both no sem, no e)
  sem:        ["gauss", "mlp"]                       # linear-Gaussian + nonlinear-MLP (ER/SF only)
  d:          [10,20]                                # number of nodes
  e:          [2]                                  # s0 = e * d edges (ignored for funnel)
  n:          [200,1000]                                 # train size (use several values for the NLL-vs-n plot)
  seeds:      [0, 1, 2, 3, 4]
  n_test:     5000                                    # held-out test size (final eval; never used for model selection)
  n_val:      5000                                     # held-out val size (inspection / model selection)
  log_every:  10                                       # per-epoch TrainingLogger cadence (0 = off)
  n_checkpoints: 10                                    # model checkpoints per cell for the learned model (0 = off)

  SSTM:
    epochs: 500
    hidden: [32, 32]
    disconnect_first_n: 2
    batch_size: 64
    lr_map: 0.01
    lr_ordering: 0.01
    lr_sparsity: 0.01
    l2: 0                      # off (l2 is inert-to-harmful on the funnel)
    l1: null                   # null -> EBIC l1 = 0.23*ln(n)/(2n), ramped 0->target by the tau_min epoch
                               # (LEARNED) / constant (ORACLE). Set a float to override / 0 for none.
    optimizer: adam            # =AdamSReg (Adam + decoupled S penalties); adamw/adamw_precond/adamsreg removed
    gate_method: "ste"
    sparsity_strength: 1.0e-3

  NotearsMLP:
    hidden: 10
    lambda1: 0.03
    lambda2: 0.03
    w_threshold: 0.5
    max_iter: 100

  # External flow baselines (context column: density only, no structure metrics), in the
  # NSF authors' nflows library (experiments/baselines/flows.py). Settings anchored to the
  # original papers: optimizer values from the papers
  # (MAF lr 1e-4 + l2 1e-6; NSF Miniboone column lr 3e-4), capacity from NSF's Miniboone
  # (smallest-data) column, grad clip 5 in FlowBase.fit. epochs 125 = the fixed-structure
  # map-refine budget (epochs/4), same rule as oracle/two_stage. dropout 0 kept from the zuko
  # era (NSF-paper Miniboone used 0.2) -- a knob now, not a library limitation.
  MAF:
    transforms: 5              # searched, selected on validation:
    hidden_features: 128       # t5 beats t10 in 31/32 (target,d,n) slices; h128 best-or-close everywhere
    num_blocks: 2
    dropout: 0.2             # searched {0, 0.1, 0.2}: 0.2 best in 21/24
                             # slices; exceptions are <=0.02-nat ties + funnel n=200 noise
    maf_scale: clamp_e         # zuko slope=e^-1 verbatim, scale in (1/e, e): best/tied in 13/16 slices;
                               # funnel n=200 instability = MAF's documented tail weakness, best-val guarded
    epochs: 125
    batch_size: 64
    lr: 3.0e-4               # unified with NSF (paired 5-seed check:
                             # better in 20/24 slices, the 4 losses are Gauss n=1000 by <=0.02 nats)
    weight_decay: 0.0        # searched {0, 1e-6}: identical to the MAF paper's 1e-6

  NSF:
    transforms: 5              # searched with MAF (same sweep): t5 >> t10 everywhere;
    hidden_features: 128       # width only matters on funnel (h128 by up to 4.8), <=0.5 elsewhere
    num_blocks: 2
    dropout: 0.2             # searched {0, 0.1, 0.2}: 0.2 best in 18/24
                             # slices, rest <=0.02-nat ties; weight decay searched too -- flat, stays 0
    bins: 4
    tail_bound: 3.0
    epochs: 125
    batch_size: 64
    lr: 3.0e-4
    weight_decay: 0.0

  GNF:                       # Wehenkel & Louppe 2021 (joint graph+density baseline). Anchor =
    emb_net: [100, 100, 100, 30]   # their published Sachs config (paper App C.1 + script CLI
    int_net: [50, 50, 50]          # defaults, same provenance split as the sachs block). The
    l1: 12.0                       # toy-recipe alternative (lr 1e-4, l1 1.0, cadence 20,
    nb_steps: 20                   # emb 3x60+30, int 3x100)
    solver: "CC"                   # enters the anchor bake-off via --ablate/--set, not here.
    nb_steps_dual:             # constraint-check interval, set so each check follows ~100 gradient
      1000: 10                 # updates at both sizes (10 updates/epoch x 10 = 100);
      200: 50                  # (2 updates/epoch x 50 = 100). Their tabular default of 100 yields
                               # no usable model at n=1000 for any l1;
                               # 10 is their own MNIST interval (App F).
    gamma:                     # ratchet progress threshold; null = their released 0.9
      1000: null
      200: 0.25                # the NOTEARS/DAG-GNN value their own code departs from; at n=200 it
                               # commits earlier and ~18x better (funnel probe 957 vs 17,036), at
                               # n=1000 their default already works. Selected on validation.
    epochs:                    # cap; the best checkpoint lands within ~50 epochs of commitment
      1000: 5000               # commits 2.1-3.0k (K=10), 3.5-4.0k (K=20)
      200: 20000               # commits 9.2-12.8k (K=10 probes); headroom for the later K=20 commits
    batch_size: 100
    lr: 1.0e-3
    weight_decay: 1.0e-2       # their MINIBOONE value (Table 6 tunes wd per dataset, 1e-5..1e-2,
                               # largest on their smallest dataset). Selected on validation: at
                               # n=200 better on all 5 targets x 5 seeds, removing catastrophic
                               # seeds (hierarch 334.7 -> 11.2, SF_mlp 15.7 -> 4.3); at n=1000 it
                               # leaves 4 of 6 targets unchanged and fixes the funnel's blown seed
                               # (5-seed mean 4.70 -> 0.28). Their default 1e-5 is the reference.

# One-variant-at-a-time ablation of the method's design choices around the paper default
# (star design). Each variant = SSTM ctor
# overrides; the 'default' variant ({}) is emitted automatically by cells().
method_ablation:
  variants:
    no_sharing:     {parameter_sharing: false}                    # pure sharing spoke: per-component W + norm + gain S
    plain:          {parameter_sharing: false, row_norm: false}   # naive per-component baseline (context row)
    row_norm_off:   {row_norm: false}                             # BE without the norm (S carries gain alone)
    mono_frac_0.25: {mono_frac: 0.25}
    mono_frac_0.75: {mono_frac: 0.75}
    mono_frac_1.0:  {mono_frac: 1.0}
    sinkhorn:       {perm_method: sinkhorn}                       # ~11x fit wall-clock at n_samples=10
    hard_concrete:  {gate_method: hard_concrete}
  graph_type: ["ER", "SF", "funnel", "hierarch"]
  sem:        ["gauss", "mlp"]                        # ER/SF only
  d:          [10, 20]
  e:          [2]                                     # s0 = e * d edges (ER/SF only)
  n:          [200, 1000]
  seeds:      [0, 1, 2, 3, 4]
  n_test:     5000
  n_val:      5000
  log_every:  10
  n_checkpoints: 0

  SSTM:                # verbatim copy of synthetic's block + explicit perm_method
    lr_decay: null             # null = ramp-and-hold (the paper schedule); "cosine" for ablation runs
    compile: false             # torch.compile(forward_with_jac) for ablation runs; changes float
                               # rounding (seed-level drift) -- never mix with eager in one table
    epochs: 500
    hidden: [32, 32]
    disconnect_first_n: 2
    batch_size: 64
    lr_map: 0.01
    lr_ordering: 0.01
    lr_sparsity: 0.01
    l2: 0
    l1: null
    optimizer: adam
    gate_method: "ste"
    perm_method: "softsort"
    sparsity_strength: 1.0e-3


# Real data with a known sparse graph (Sachs 2005).
#   uv run python -m experiments.runner.launch --experiment sachs [--select model=...]
# Per-seed 80/10/10 split + init; synthetic-regime settings (fixed-structure models
# self-shorten to 125 epochs via the map-refine rule in fit).
sachs:
  subsets: [pooled, obs853]  # pooled = all 7,466 rows (NOTEARS-comparable, interventional mixture);
                             # obs853 = first 853 rows (observational condition, bnlearn-verified)
  models: [learned, random, oracle, two_stage, maf, nsf, gnf]
  seeds: [0, 1, 2, 3, 4]
  log_every: 10
  n_checkpoints: 0
  SSTM:              # = synthetic block (the synthetic paper default)
    epochs: 500
    hidden: [32, 32]
    disconnect_first_n: 2
    batch_size: 64
    lr_map: 0.01
    lr_ordering: 0.01
    lr_sparsity: 0.01
    l2: 0
    l1: null                 # EBIC 0.23*ln(n)/(2n)
    optimizer: adam
    gate_method: "ste"
    sparsity_strength: 1.0e-3
  NotearsMLP:
    hidden: 10
    lambda1: 0.03
    lambda2: 0.03
    w_threshold: 0.5
    max_iter: 100
  MAF:                       # = the searched synthetic flow settings
    transforms: 5
    hidden_features: 128
    num_blocks: 2
    dropout: 0.2
    maf_scale: clamp_e
    epochs: 125
    batch_size: 64
    lr: 3.0e-4
    weight_decay: 0.0
  NSF:
    transforms: 5
    hidden_features: 128
    num_blocks: 2
    dropout: 0.2
    bins: 4
    tail_bound: 3.0
    epochs: 125
    batch_size: 64
    lr: 3.0e-4
    weight_decay: 0.0
  GNF:                       # Wehenkel & Louppe 2021; their Sachs ("proteins") settings where
    emb_net: [100, 100, 100, 30]   # published (paper App. C.1: conditioner 3x100 + one-hot,
    int_net: [50, 50, 50]          # embedding 30, UMNN integrand 3x50, lambda_L1 = 12);
    l1: 12.0                       # the rest = their script's CLI defaults, undocumented in the
    nb_steps: 20                   # paper (lr 1e-3, batch 100, wd 1e-5, dual cadence 100,
    solver: "CC"                   # cap 10000 epochs) -- disclosed as such.
    nb_steps_dual: 100
    epochs: 
      pooled: 10000
      obs853: 85000
    batch_size: 100
    lr: 1.0e-3
    weight_decay: 1.0e-5
